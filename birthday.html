<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05060f">
<title>生日快乐 · 烟花祝福</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#fff4d8;
    --accent:#ffd76a;
    --accent2:#ff7bb0;
    --sky-top:#080b20;
    --sky-mid:#121a3c;
    --sky-bot:#241a35;
  }
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#05060f;color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  /* 夜空背景（纯 CSS，即使 JS 完全禁用也有渐变夜空 + 星星） */
  .sky{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 80% at 50% 108%, #3a2148 0%, rgba(58,33,72,0) 60%),
      radial-gradient(90% 60% at 12% 8%, rgba(120,90,255,.35) 0%, rgba(120,90,255,0) 62%),
      linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-bot) 100%);
  }
  .sky::after{ /* 星尘 */
    content:"";position:absolute;inset:0;opacity:.75;
    background-image:
      radial-gradient(1.6px 1.6px at 20% 18%, #fff 40%, transparent 41%),
      radial-gradient(1.4px 1.4px at 68% 12%, #fff 40%, transparent 41%),
      radial-gradient(1.2px 1.2px at 42% 34%, #ffe9b0 40%, transparent 41%),
      radial-gradient(1.7px 1.7px at 84% 42%, #fff 40%, transparent 41%),
      radial-gradient(1.3px 1.3px at 12% 52%, #cfe0ff 40%, transparent 41%),
      radial-gradient(1.5px 1.5px at 56% 66%, #fff 40%, transparent 41%),
      radial-gradient(1.2px 1.2px at 30% 80%, #ffe9b0 40%, transparent 41%),
      radial-gradient(1.6px 1.6px at 90% 74%, #fff 40%, transparent 41%),
      radial-gradient(1.2px 1.2px at 74% 88%, #cfe0ff 40%, transparent 41%);
    animation:twinkle 4.2s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:.9}}
  .moon{
    position:fixed;right:11%;top:9%;width:54px;height:54px;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 35% 32%, #fffdf2, #ffe9a8 60%, #f3d071 100%);
    box-shadow:0 0 34px 10px rgba(255,231,160,.32), 0 0 90px 30px rgba(255,224,140,.16);
    animation:floaty 7s ease-in-out infinite alternate;
  }
  @keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-10px)}}

  #fx{position:fixed;inset:0;z-index:2;display:block;width:100%;height:100%}

  /* 中央祝福文字 */
  .stage{
    position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    padding:max(18px, env(safe-area-inset-top)) 18px max(72px, env(safe-area-inset-bottom));
    text-align:center;pointer-events:none;
    opacity:0;transform:scale(.82);transition:opacity .9s ease, transform 1.1s cubic-bezier(.18,.9,.22,1);
  }
  .stage.show{opacity:1;transform:scale(1)}
  .hello{font-size:clamp(13px,4.2vw,17px);letter-spacing:.42em;text-indent:.42em;color:#ffe9b8;opacity:.9;text-shadow:0 0 14px rgba(255,214,120,.55)}
  .greet{
    font-size:clamp(38px,13.5vw,86px);font-weight:900;letter-spacing:.06em;line-height:1.16;
    background:linear-gradient(180deg,#fffdf3 0%,#ffe08a 42%,#ffb545 72%,#ff8fb8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 rgba(120,50,0,.28)) drop-shadow(0 0 26px rgba(255,190,90,.6));
    animation:breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .en{margin-top:2px;font-size:clamp(11px,3.4vw,15px);letter-spacing:.34em;text-indent:.34em;color:#ffd9ec;text-shadow:0 0 16px rgba(255,123,176,.7)}
  .card{
    margin-top:16px;max-width:min(92vw,430px);padding:15px 18px 16px;border-radius:18px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.24);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    box-shadow:0 14px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .card p{font-size:clamp(13.5px,4.1vw,16.5px);line-height:1.95;color:#fff8e6;text-shadow:0 1px 10px rgba(0,0,0,.55);white-space:pre-wrap}
  .cake{font-size:clamp(24px,7.5vw,34px);line-height:1;margin-bottom:6px;animation:floaty 3.2s ease-in-out infinite alternate}
  /* 飘落的彩纸 */
  .confetti{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-12vh;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall linear infinite}
  @keyframes fall{
    0%{opacity:0;transform:translate3d(0,-14vh,0) rotate(0deg)}
    8%{opacity:.95}
    100%{opacity:0;transform:translate3d(var(--dx,0),112vh,0) rotate(760deg)}
  }
  /* 底部操作 */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  }
  .hint{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:#ffedc4;letter-spacing:.06em;
    background:rgba(10,12,28,.5);border:1px solid rgba(255,255,255,.22);
    padding:9px 15px;border-radius:999px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .hint.hide{display:none}
  @keyframes pulse{0%,100%{opacity:.72;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{
    font:inherit;font-size:13.5px;color:#2a1200;font-weight:700;letter-spacing:.06em;
    padding:10px 18px;border:0;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,#ffe9a6,#ffc247);
    box-shadow:0 6px 18px rgba(255,180,60,.42), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .12s ease, filter .2s ease;
  }
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff2d4;border:1px solid rgba(255,255,255,.3);box-shadow:none}
  .btn:active{transform:scale(.94);filter:brightness(1.06)}
  @media (prefers-reduced-motion: reduce){
    .greet,.moon,.sky::after,.cake,.hint{animation:none}
  }
  /* 大屏 / 微信电脑版：限制成手机竖屏比例，居中显示 */
  @media (min-aspect-ratio: 1/1) and (min-width: 680px){
    .sky{
      background:
        radial-gradient(120% 80% at 50% 108%, #3a2148 0%, rgba(58,33,72,0) 60%),
        radial-gradient(60% 60% at 50% 45%, rgba(120,90,255,.28) 0%, rgba(120,90,255,0) 65%),
        linear-gradient(180deg,#04050d 0%, #0a0d1e 50%, #04050d 100%);
    }
    #fx,.stage,.confetti{max-width:560px;margin-left:auto;margin-right:auto}
    #fx{left:0;right:0}
    .moon{right:auto;left:calc(50% + 150px)}
    .stage{border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
    .greet{font-size:clamp(56px,7vw,92px)}
    .card{max-width:460px}
    .bar{max-width:560px;margin:0 auto}
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="moon" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="stage" id="stage">
    <div class="hello" id="hello">HAPPY BIRTHDAY</div>
    <h1 class="greet" id="greet">生日快乐</h1>
    <div class="en">HAPPY BIRTHDAY TO YOU</div>
    <section class="card">
      <div class="cake" aria-hidden="true">🎂</div>
      <p id="wish">愿你新的一岁：\n所愿皆得，所行皆坦途，\n每一天都值得被庆祝 🎉</p>
    </section>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <div class="bar">
    <button class="hint" id="soundHint" type="button">🔊 点一下这里，有生日歌和烟花</button>
    <div class="btns" id="btns">
      <button class="btn" id="replay" type="button">🎆 再放一次烟花</button>
      <button class="btn ghost" id="song" type="button">🎵 生日歌</button>
    </div>
  </div>

<script>
/* ==========================================================================
   生日烟花祝福页 —— 单文件，可直接微信打开
   要改人名/祝福语，只改下面 CONFIG 里那几行就够了（其余不用动）
   或者用链接参数：index.html?to=小美
   ========================================================================== */
var CONFIG = {
  to:       "饶爷",                                    // 送给谁，例如 "小美"；留空则不显示  ← 人名写这里
  greet:    "生日快乐",                             // 中央大字
  hello:    "HAPPY BIRTHDAY",                      // 大字上方小字
  wish:     "愿你新的一岁：\n生日快乐，新一岁发大财，\n每一天都值得被庆祝 🎉",  // 祝福语（\n 换行）
  sign:     "",                                    // 落款，例如 "—— 永远爱你的 阿明"
  sound:    true,                                  // 是否尝试播放生日歌（手机需点一下才出声）
  autoOpen: true                                   // 打开后自动弹出祝福
};

/* 也可以用链接参数传人名，这样同一个文件能给不同的人发：
   index.html?to=小美&sign=永远爱你的阿明&wish=第一行%0A第二行
   链接里的写法优先于上面 CONFIG 写死的值 */
(function applyUrlParams(){
  var q = (location.search || "").replace(/^\?/, "");
  if (!q) return;
  var pairs = q.split("&");
  for (var i = 0; i < pairs.length; i++){
    if (!pairs[i]) continue;
    var eq = pairs[i].indexOf("=");
    var key = eq < 0 ? pairs[i] : pairs[i].slice(0, eq);
    var val = eq < 0 ? "" : pairs[i].slice(eq + 1);
    try { key = decodeURIComponent(key.replace(/\+/g, " ")); val = decodeURIComponent(val.replace(/\+/g, " ")); } catch(e){}
    if (Object.prototype.hasOwnProperty.call(CONFIG, key) && val) CONFIG[key] = val;
  }
})();

/* ------------------------- 0. 内容注入 ------------------------- */
(function fill(){
  var $ = function(id){ return document.getElementById(id); };
  var greetText = (CONFIG.to ? CONFIG.to + "，" : "") + (CONFIG.greet || "生日快乐");
  $("greet").textContent = greetText;
  $("hello").textContent = CONFIG.hello || "";
  var wish = CONFIG.wish || "";
  if (CONFIG.sign) wish += "\n" + CONFIG.sign;
  $("wish").textContent = wish;
  document.title = greetText + " 🎂";
})();

/* ------------------------- 1. 音效（WebAudio 合成，不需音频文件） ------------------------- */
var Sfx = (function(){
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master = null, on = false;

  function init(){
    if (ctx || !AC) return !!ctx;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.28;
      master.connect(ctx.destination);
    } catch(e){ ctx = null; }
    return !!ctx;
  }
  function resume(){
    if (!ctx) return;
    if (ctx.state === "suspended" && ctx.resume) { try { ctx.resume(); } catch(e){} }
  }
  // 单音：freq 频率，t0 起始秒，dur 时长，type 波形，gain 音量
  function note(freq, t0, dur, type, gain){
    if (!on || !ctx) return;
    var t = ctx.currentTime + t0;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.25, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.06);
  }
  function unlock(){ if (!init()) return false; resume(); on = true; return true; }

  // 烟花：白噪声爆裂 + 低频闷响
  function boom(){
    if (!on || !ctx) return;
    var t = ctx.currentTime;
    var len = Math.floor(ctx.sampleRate * 0.55);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++){
      var p = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, 3.2);
    }
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.setValueAtTime(1500, t);
    bp.frequency.exponentialRampToValueAtTime(380, t + 0.5);
    bp.Q.value = 0.8;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.6);

    // 闷响
    var o = ctx.createOscillator(), og = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.35);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t + 0.45);
  }
  // 上升的发射声
  function whoosh(){
    if (!on || !ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(900, t + 0.7);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.8);
  }
  var songTimer = null;
  // 生日歌：G G A G C B / G G A G D C / G G G' E C B A / F F E C D C
  var MELODY = [
    [392,.34],[392,.17],[440,.5],[392,.5],[523,.5],[494,.9],
    [392,.34],[392,.17],[440,.5],[392,.5],[587,.5],[523,.9],
    [392,.34],[392,.17],[784,.5],[659,.5],[523,.5],[494,.5],[440,.9],
    [698,.34],[698,.17],[659,.5],[523,.5],[587,.5],[523,1.0]
  ];
  function song(){
    if (!on || !ctx) return;
    if (songTimer) { clearTimeout(songTimer); songTimer = null; }
    var t = 0;
    for (var i = 0; i < MELODY.length; i++){
      var f = MELODY[i][0], dur = MELODY[i][1] * 0.62;
      note(f, t, dur * 0.92, "triangle", 0.22);
      note(f / 2, t, dur * 0.9, "sine", 0.07); // 低八度铺底
      t += dur;
    }
    songTimer = setTimeout(function(){ songTimer = null; }, t * 1000 + 500);
  }
  return {
    unlock: unlock,
    boom: boom,
    whoosh: whoosh,
    song: song,
    isOn: function(){ return on; }
  };
})();

/* ------------------------- 2. 烟花引擎 ------------------------- */
var FW = (function(){
  var cvs = document.getElementById("fx");
  var ctx = cvs.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var rockets = [], sparks = [];
  var running = true, rafId = 0, last = 0, spawnAcc = 0;
  var PALETTE = [
    ["#fff2b0","#ffd15c","#ff9f43"],
    ["#ffd9ec","#ff7bb0","#ff3d78"],
    ["#d8f0ff","#6fd0ff","#2a86ff"],
    ["#e2ffd9","#8ff08a","#25c16f"],
    ["#efe3ff","#b98cff","#7a4bff"],
    ["#fff6e0","#ffc46b","#ff7a45"]
  ];
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.clientWidth || window.innerWidth;
    H = cvs.clientHeight || window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "lighter";
  }

  function Rocket(x, targetY, hue){
    this.x = x; this.y = H + 8;
    this.targetY = targetY || rnd(H * 0.12, H * 0.48);
    this.vx = rnd(-18, 18);
    this.vy = -rnd((H - targetY) * 0.62, (H - targetY) * 0.78);
    this.g = rnd(160, 210);
    this.pal = hue || pick(PALETTE);
    this.trail = [];
    this.done = false;
  }
  Rocket.prototype.update = function(dt){
    this.trail.push([this.x, this.y]);
    if (this.trail.length > 9) this.trail.shift();
    this.vy += this.g * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.vy >= -40 || this.y <= this.targetY) return this.explode();
    if (this.y < 0) this.done = true;
  };
  Rocket.prototype.explode = function(){
    this.done = true;
    burst(this.x, this.y, this.pal);
    Sfx.boom();
  };
  Rocket.prototype.draw = function(){
    for (var i = 0; i < this.trail.length; i++){
      var p = this.trail[i], a = (i + 1) / this.trail.length;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = this.pal[0];
      ctx.beginPath();
      ctx.arc(p[0], p[1], 1.1 + a * 1.7, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#fffdf0";
    ctx.beginPath(); ctx.arc(this.x, this.y, 2.4, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = this.pal[1];
    ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  };

  function Spark(x, y, vx, vy, color, life, size){
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.life = life; this.age = 0;
    this.size = size || rnd(1.5, 3.1);
    this.px = x; this.py = y;
  }
  Spark.prototype.update = function(dt){
    this.px = this.x; this.py = this.y;
    this.vy += 58 * dt;              // 轻微重力
    this.vx *= 0.985; this.vy *= 0.985;  // 空气阻力
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.age += dt;
  };
  Spark.prototype.draw = function(){
    var p = this.age / this.life;
    var a = Math.pow(1 - p, 1.5);
    if (a <= 0.01) return;
    if (Math.random() < 0.055) p = 1; // 闪烁
    ctx.globalAlpha = p >= 1 ? 0 : a;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size * (1 - p * 0.75);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(this.px, this.py);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    if (!p){
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.7, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  };

  function burst(x, y, pal){
    var n = 78 + ((Math.random() * 46) | 0);
    var speed = rnd(125, 215);
    var base = Math.random() * 6.2832;
    for (var i = 0; i < n; i++){
      var a = base + (i / n) * 6.2832 + rnd(-0.05, 0.05);
      var s = speed * rnd(0.32, 1);
      sparks.push(new Spark(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(pal), rnd(1.15, 2.1), rnd(1.7, 3.2)));
    }
    // 内圈高亮，让爆点更饱满
    for (var k = 0; k < 30; k++){
      var a3 = Math.random() * 6.2832, s3 = speed * rnd(0.08, 0.34);
      sparks.push(new Spark(x, y, Math.cos(a3) * s3, Math.sin(a3) * s3, "#fffdf2", rnd(0.7, 1.15), rnd(1.6, 2.6)));
    }
    // 中心闪光
    for (var j = 0; j < 12; j++){
      var a2 = Math.random() * 6.2832, s2 = rnd(12, 48);
      sparks.push(new Spark(x, y, Math.cos(a2) * s2, Math.sin(a2) * s2, "#fffdf0", rnd(0.45, 0.8), 2.6));
    }
  }

  var HEART = (function(){
    var pts = [], N = 30;
    for (var i = 0; i < N; i++){
      var t = (i / N) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push([hx / 16, hy / 16]);
    }
    return pts;
  })();

  // 心形烟花
  function burstHeart(x, y, pal){
    pal = pal || ["#ffd9ec","#ff6fa8","#ff2d6f"];
    var scale = rnd(95, 135);
    for (var k = 0; k < HEART.length; k++){
      for (var r = 0; r < 4; r++){
        var s = scale * (0.72 + r * 0.09) * rnd(0.97, 1.03);
        sparks.push(new Spark(
          x, y,
          HEART[k][0] * s + rnd(-8, 8),
          HEART[k][1] * s + rnd(-8, 8),
          pal[k % pal.length],
          rnd(1.25, 2.0),
          rnd(1.7, 2.9)
        ));
      }
    }
    Sfx.boom();
  }

  function launch(targetY){
    var x = rnd(W * 0.12, W * 0.88);
    var ty = targetY || rnd(H * 0.1, H * 0.5);
    rockets.push(new Rocket(x, ty));
    Sfx.whoosh();
  }

  function heartBurst(x, y){ burstHeart(x || rnd(W * 0.25, W * 0.75), y || rnd(H * 0.2, H * 0.42)); }

  // 开场：连续上升 + 齐射 + 两颗心
  function finale(){
    launch(H * rnd(0.12, 0.3));
    for (var i = 0; i < 7; i++){
      setTimeout(function(){ launch(); }, 120 + i * 190 + Math.random() * 90);
    }
    setTimeout(function(){ heartBurst(); }, 1500);
    setTimeout(function(){ heartBurst(); }, 2300);
    setTimeout(function(){ launch(H * rnd(0.15, 0.35)); }, 2900);
  }

  function step(ts){
    rafId = requestAnimationFrame(step);
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    if (!running || W === 0) return;

    // 残影（形成柔和拖尾）
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(5,6,15,0.19)";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    // 自动放烟花
    spawnAcc += dt;
    var interval = Math.min(2.6, 0.55 + sparks.length / 900);
    if (spawnAcc >= interval){
      spawnAcc = 0;
      launch();
      if (Math.random() < 0.18) heartBurst();
    }

    for (var i = rockets.length - 1; i >= 0; i--){
      rockets[i].update(dt);
      rockets[i].draw();
      if (rockets[i].done) rockets.splice(i, 1);
    }
    for (var j = sparks.length - 1; j >= 0; j--){
      var sp = sparks[j];
      sp.update(dt);
      if (sp.age >= sp.life || sp.y > H + 60 || sp.x < -80 || sp.x > W + 80) sparks.splice(j, 1);
      else sp.draw();
    }
    ctx.globalAlpha = 1;
  }

  // 点击屏幕：从手指位置再炸一朵
  function tapBurst(px, py){
    burst(px, py, pick(PALETTE));
    if (Math.random() < 0.34) heartBurst(px, py - 30);
  }

  function start(){ resize(); if (!rafId) rafId = requestAnimationFrame(step); }

  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 260); }, { passive: true });
  document.addEventListener("visibilitychange", function(){
    running = !document.hidden;
    last = 0;
    if (running) Sfx.unlock();
  });

  return { start: start, launch: launch, finale: finale, heart: heartBurst, tap: tapBurst, count: function(){ return sparks.length; } };
})();

/* ------------------------- 3. 彩纸 / 开场 / 交互 ------------------------- */
var UI = (function(){
  var stage = document.getElementById("stage");
  var hint = document.getElementById("soundHint");
  var conf = document.getElementById("confetti");
  var COLORS = ["#ffd15c","#ff7bb0","#6fd0ff","#8ff08a","#b98cff","#fff2b0","#ff9f43"];
  var opened = false;

  function confetti(n, burstMode){
    n = n || 34;
    for (var i = 0; i < n; i++){
      var el = document.createElement("i");
      el.style.left = (Math.random() * 100) + "vw";
      el.style.background = COLORS[(Math.random() * COLORS.length) | 0];
      el.style.width = (5 + Math.random() * 7) + "px";
      el.style.height = (9 + Math.random() * 12) + "px";
      el.style.setProperty("--dx", (Math.random() * 30 - 15) + "vw");
      var dur = burstMode ? (1.9 + Math.random() * 2.2) : (3.4 + Math.random() * 4.2);
      el.style.animationDuration = dur + "s";
      el.style.animationDelay = (burstMode ? Math.random() * 0.7 : Math.random() * 5) + "s";
      if (Math.random() < 0.4) el.style.borderRadius = "50%";
      conf.appendChild(el);
      (function(node){
        setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, (dur + 6) * 1000);
      })(el);
    }
  }

  function open(){
    if (opened) return;
    opened = true;
    stage.classList.add("show");
    confetti(28, true);
  }

  function celebrate(){
    FW.finale();
    confetti(40, true);
    setTimeout(function(){ confetti(26, true); }, 900);
  }

  function audioOn(){
    if (Sfx.unlock()){
      hint.classList.add("hide");
      if (CONFIG.sound) Sfx.song();
      setTimeout(function(){ Sfx.boom(); }, 120);
      return true;
    }
    return false;
  }

  // 首次点按：解锁音频 + 立即再炸一轮
  document.addEventListener("touchstart", function(){ audioOn(); }, { passive: true, once: true });
  document.addEventListener("pointerdown", function(){ audioOn(); }, { once: true });

  // 点击/触摸画布区域 → 在点处放烟花
  function onTap(e){
    audioOn();
    var pt = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
    if (typeof pt.clientX !== "number") return;
    FW.tap(pt.clientX, pt.clientY);
  }
  document.addEventListener("touchstart", onTap, { passive: true });
  document.addEventListener("mousedown", function(e){
    if (e.target && e.target.tagName === "BUTTON") return;
    onTap(e);
  });

  document.getElementById("replay").addEventListener("click", function(e){
    e.stopPropagation();
    audioOn();
    celebrate();
  });
  document.getElementById("song").addEventListener("click", function(e){
    e.stopPropagation();
    if (audioOn()) Sfx.song();
  });

  // 定时自动庆祝
  setInterval(function(){
    if (document.hidden) return;
    FW.heart();
  }, 11000);

  return {
    init: function(){
      FW.start();
      // 开场
      setTimeout(function(){ FW.launch(); }, 120);
      setTimeout(function(){ FW.launch(); }, 460);
      if (CONFIG.autoOpen !== false){
        setTimeout(open, 1100);
        setTimeout(celebrate, 1250);
      } else {
        open();
      }
      confetti(16, false);
    },
    open: open,
    celebrate: celebrate,
    audioOn: audioOn
  };
})();

/* ------------------------- 4. 启动 ------------------------- */
function boot(){ UI.init(); }
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
// 兜底：即使脚本出错，文字也要显示出来
setTimeout(function(){ UI.open(); }, 2600);
// 页面被切回前台时恢复音频解锁
window.addEventListener("pageshow", function(){ UI.audioOn(); });
</script>
</body>
</html>
